# Include only in the liunianaw.online HTTPS server's existing extension directory.
# The reverse SSH listener binds to 127.0.0.1 on the server.
location ^~ /dev08/ {
    proxy_pass http://127.0.0.1:18030/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 70s;
    proxy_buffering off;
}
