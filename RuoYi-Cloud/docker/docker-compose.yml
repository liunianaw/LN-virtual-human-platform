version: '3.8'

x-common-client-env: &common-client-env
  NACOS_ADDR: "${NACOS_ADDR:-ruoyi-nacos:8848}"
  NACOS_USERNAME: "${NACOS_USERNAME:?Set NACOS_USERNAME}"
  NACOS_PASSWORD: "${NACOS_PASSWORD:?Set NACOS_PASSWORD}"
  REDIS_HOST: "${REDIS_HOST:-ruoyi-redis}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

x-rabbitmq-client-env: &rabbitmq-client-env
  RABBITMQ_HOST: "${RABBITMQ_HOST:-ruoyi-rabbitmq}"
  RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
  RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
  RABBITMQ_VHOST: "${RABBITMQ_VHOST:?Set RABBITMQ_VHOST}"

services:
  ruoyi-mysql:
    container_name: ruoyi-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command:
      - mysqld
      - --innodb-buffer-pool-size=80M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
    environment:
      MYSQL_DATABASE: ry-cloud
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  ruoyi-redis:
    container_name: ruoyi-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/ruoyi/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/ruoyi/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  ruoyi-nacos:
    container_name: ruoyi-nacos
    image: nacos/nacos-server:v3.0.2
    build:
      context: ./nacos
    environment:
      MODE: standalone
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN}"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE}"
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/nacos/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  ruoyi-rabbitmq:
    container_name: ruoyi-rabbitmq
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:?Set RABBITMQ_VHOST}"
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    environment:
      <<: [*common-client-env, *rabbitmq-client-env]
      PLATFORM_DB_URL: "${PLATFORM_DB_URL:?Set PLATFORM_DB_URL}"
      PLATFORM_DB_USER: "${PLATFORM_DB_USER:?Set PLATFORM_DB_USER}"
      PLATFORM_DB_PASSWORD: "${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}"
      COS_REGION: "${COS_REGION:-}"
      COS_BUCKET: "${COS_BUCKET:-}"
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
      COS_SESSION_TOKEN: "${COS_SESSION_TOKEN:-}"
      COS_ENABLED: "${COS_ENABLED:-false}"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy
      ruoyi-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9201/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  ruoyi-modules-session:
    container_name: ruoyi-modules-session
    build:
      context: ./ruoyi/modules/session
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    environment:
      <<: [*common-client-env, *rabbitmq-client-env]
      SESSION_DB_URL: "${SESSION_DB_URL:?Set SESSION_DB_URL}"
      SESSION_DB_USER: "${SESSION_DB_USER:?Set SESSION_DB_USER}"
      SESSION_DB_PASSWORD: "${SESSION_DB_PASSWORD:?Set SESSION_DB_PASSWORD}"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy
      ruoyi-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9202/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  ruoyi-auth:
    container_name: ruoyi-auth
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    environment:
      <<: *common-client-env
    depends_on:
      ruoyi-redis:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  ruoyi-gateway:
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *common-client-env
    depends_on:
      ruoyi-auth:
        condition: service_healthy
      ruoyi-modules-system:
        condition: service_healthy
      ruoyi-modules-session:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  ruoyi-media-api:
    container_name: ruoyi-media-api
    build:
      context: ../../ruoyi-media
      dockerfile: Dockerfile
    command: ["uvicorn", "ruoyi_media.api.app:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    environment:
      <<: *rabbitmq-client-env
      RUOYI_MEDIA_HOST: 0.0.0.0
      RUOYI_MEDIA_PORT: "8002"
    depends_on:
      ruoyi-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 12

  ruoyi-media-worker:
    container_name: ruoyi-media-worker
    build:
      context: ../../ruoyi-media
      dockerfile: Dockerfile
    command: ["python", "-m", "ruoyi_media.worker", "--interval", "30"]
    environment:
      <<: *rabbitmq-client-env
    depends_on:
      ruoyi-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ruoyi-nginx:
    container_name: ruoyi-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      ruoyi-gateway:
        condition: service_healthy

  ruoyi-modules-gen:
    profiles: ["devtools"]
    container_name: ruoyi-modules-gen
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    environment:
      <<: *common-client-env
      DB_URL: "${LEGACY_DB_URL:?Set LEGACY_DB_URL}"
      DB_USER: "${LEGACY_DB_USER:?Set LEGACY_DB_USER}"
      DB_PASSWORD: "${LEGACY_DB_PASSWORD:?Set LEGACY_DB_PASSWORD}"
      TOOL_DB_URL: "${TOOL_DB_URL:-}"
      TOOL_DB_USER: "${TOOL_DB_USER:-}"
      TOOL_DB_PASSWORD: "${TOOL_DB_PASSWORD:-}"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy

  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    environment:
      <<: *common-client-env
      DB_URL: "${LEGACY_DB_URL:?Set LEGACY_DB_URL}"
      DB_USER: "${LEGACY_DB_USER:?Set LEGACY_DB_USER}"
      DB_PASSWORD: "${LEGACY_DB_PASSWORD:?Set LEGACY_DB_PASSWORD}"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy

  ruoyi-visual-monitor:
    profiles: ["monitoring"]
    container_name: ruoyi-visual-monitor
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
    environment:
      <<: *common-client-env
      MONITOR_USER: "${MONITOR_USER:-admin}"
      MONITOR_PASSWORD: "${MONITOR_PASSWORD:?Set MONITOR_PASSWORD}"
      DB_URL: "${LEGACY_DB_URL:?Set LEGACY_DB_URL}"
      DB_USER: "${LEGACY_DB_USER:?Set LEGACY_DB_USER}"
      DB_PASSWORD: "${LEGACY_DB_PASSWORD:?Set LEGACY_DB_PASSWORD}"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-nacos:
        condition: service_healthy
