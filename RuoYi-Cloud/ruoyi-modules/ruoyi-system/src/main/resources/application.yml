spring:
  config:
    import: optional:classpath:application-local.yml
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated

# Credentials supplied by process environment.
platform:
  generation:
    outbox:
      publisher-id: ${PLATFORM_OUTBOX_PUBLISHER_ID:system-outbox-publisher}
      publisher-delay-ms: ${PLATFORM_OUTBOX_PUBLISHER_DELAY_MS:1000}
    timeout:
      scan-delay-ms: ${PLATFORM_GENERATION_TIMEOUT_SCAN_DELAY_MS:30000}
      unsubmitted-seconds: ${PLATFORM_GENERATION_UNSUBMITTED_TIMEOUT_SECONDS:300}
  storage:
    cos:
      enabled: ${COS_ENABLED:false}
      region: ${COS_REGION:}
      bucket: ${COS_BUCKET:}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      session-token: ${COS_SESSION_TOKEN:}
      read-url-seconds: ${COS_READ_URL_SECONDS:900}
