# Credentials supplied by process environment.
platform:
  storage:
    cos:
      enabled: ${COS_ENABLED:false}
      region: ${COS_REGION:}
      bucket: ${COS_BUCKET:}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      session-token: ${COS_SESSION_TOKEN:}
      read-url-seconds: ${COS_READ_URL_SECONDS:900}
