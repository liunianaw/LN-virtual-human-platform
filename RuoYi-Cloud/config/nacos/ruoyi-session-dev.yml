spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SESSION_DB_URL:jdbc:mysql://localhost:3306/session_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SESSION_DB_USER:root}
    password: ${SESSION_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Runtime limits and enablement only. Provider credentials stay outside Nacos,
# database rows, logs and public request DTOs; adapters read them from their
# protected deployment environment when they are implemented.
ln:
  session:
    voice:
      max-code-points-per-segment: ${LN_SESSION_TTS_MAX_CODEPOINTS:200}
      max-buffered-segments: ${LN_SESSION_TTS_MAX_BUFFERED_SEGMENTS:2}
      max-audio-bytes: ${LN_SESSION_TTS_MAX_AUDIO_BYTES:5242880}
      temporary-audio-ttl: ${LN_SESSION_TTS_TEMP_AUDIO_TTL:15m}
      official:
        enabled: ${LN_SESSION_TTS_OFFICIAL_ENABLED:false}
        timeout: ${LN_SESSION_TTS_OFFICIAL_TIMEOUT:30s}
      relay:
        enabled: ${LN_SESSION_TTS_RELAY_ENABLED:false}
        timeout: ${LN_SESSION_TTS_RELAY_TIMEOUT:30s}
