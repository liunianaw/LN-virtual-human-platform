spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SESSION_DB_URL:jdbc:mysql://localhost:3306/session_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SESSION_DB_USER:root}
    password: ${SESSION_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
