spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: false
          routes:
          - id: ruoyi-auth
            uri: lb://ruoyi-auth
            predicates:
            - Path=/auth/**
            filters:
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
            - ValidateCodeFilter
            - StripPrefix=1
          - id: ruoyi-job
            uri: lb://ruoyi-job
            predicates:
            - Path=/schedule/**
            filters:
            - StripPrefix=1
          - id: ruoyi-system
            uri: lb://ruoyi-system
            predicates:
            - Path=/system/**
            filters:
            - StripPrefix=1
          - id: platform-official-voices
            uri: lb://ruoyi-system
            predicates:
            - Path=/api/v1/voices/**,/api/v1/admin/voices/**,/api/v1/admin/avatars/**,/api/v1/admin/official-services/**
          - id: platform-debug-system
            uri: lb://ruoyi-system
            predicates:
            - Path=/api/v1/debug-sessions/**
          - id: platform-runtime
            uri: lb://ruoyi-session
            predicates:
            - Path=/api/v1/runtime/**,/api/v1/realtime
security:
  captcha:
    enabled: true
    type: math
  xss:
    enabled: true
    excludeUrls: []
  ignore:
    whites:
    - /auth/logout
    - /auth/login
    - /auth/register
    - /*/v2/api-docs
    - /*/v3/api-docs
    - /csrf
springdoc:
  webjars:
    prefix: null
  swagger-ui:
    urls:
    - name: ruoyi-job
      url: /schedule/v3/api-docs
    - name: ruoyi-system
      url: /system/v3/api-docs
